@font-face{font-family:'Anybody';src:url('../../assets/fonts/Anybody-Variable.ttf');font-stretch:50% 150%;font-weight:100 900}

<style>
body{margin:0}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid #121212;outline-offset:2px}
button{font-family:inherit;cursor:pointer}
.karcis{--sobek:calc(100% - 30px);position:relative;border-radius:4px;-webkit-mask:radial-gradient(circle 8px at var(--sobek) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at var(--sobek) 100%,#0000 97%,#000) bottom/100% 51% no-repeat;mask:radial-gradient(circle 8px at var(--sobek) 0,#0000 97%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at var(--sobek) 100%,#0000 97%,#000) bottom/100% 51% no-repeat}
.karcis::after{content:"";position:absolute;top:10px;bottom:10px;left:var(--sobek);border-left:2px dashed currentColor;opacity:.55}
.garis{filter:drop-shadow(2px 0 0 #121212) drop-shadow(-2px 0 0 #121212) drop-shadow(0 2px 0 #121212) drop-shadow(0 -2px 0 #121212)}
.garis15{filter:drop-shadow(1.5px 0 0 #121212) drop-shadow(-1.5px 0 0 #121212) drop-shadow(0 1.5px 0 #121212) drop-shadow(0 -1.5px 0 #121212)}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px 4px 10px;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;line-height:1.2;color:#121212;white-space:nowrap;border-radius:4px;-webkit-mask:radial-gradient(circle 4px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 4px at 0 50%,#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,#0000 97%,#000) right/51% 100% no-repeat}
.stabilo{background:linear-gradient(176deg,transparent 30%,#D4F25C 30%,#D4F25C 88%,transparent 88%);padding:0 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.h1{font-family:'Anybody',sans-serif;font-stretch:75%;font-weight:800;font-size:28px;line-height:1;letter-spacing:-0.2px;margin:0}
.h2{font-family:'Anybody',sans-serif;font-stretch:75%;font-weight:800;font-size:20px;line-height:1.1;margin:0}
.selotip{position:absolute;background:rgba(235,232,220,.82);clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,100% 0,96% 12%,100% 24%,96% 38%,100% 52%,96% 66%,100% 80%,96% 92%,100% 100%,0 100%,4% 86%,0 72%,4% 58%,0 44%,4% 30%,0 18%)}
.btn{min-height:56px;box-sizing:border-box;border-radius:4px;font-size:16px;font-weight:800;line-height:1.15;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;text-decoration:none;text-align:center}
.btn-utama{background:#3048FF;color:#FFFFFF;border:0}
.btn-kedua{background:#FFFFFF;color:#121212;border:2px solid #121212}
.kembali{width:48px;height:48px;flex:none;box-sizing:border-box;border:2px solid #121212;border-radius:4px;background:#FFFFFF;color:#121212;display:flex;align-items:center;justify-content:center;padding:0}
nav.v5{height:76px;flex:none;border-top:2px solid #121212;background:#FFFFFF;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:stretch;box-sizing:border-box}
nav.v5 a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600;color:#5B5B66;text-decoration:none;min-height:48px}
nav.v5 a[aria-current="page"]{color:#121212;font-weight:800}
nav.v5 a[aria-current="page"] .l{box-shadow:inset 0 -6px 0 #D4F25C;padding:0 2px}
nav.v5 .rana{width:52px;height:52px;border-radius:50%;background:#3048FF;display:flex;align-items:center;justify-content:center;margin-top:-24px;border:3px solid #FFFFFF;box-shadow:0 0 0 2px #121212;box-sizing:border-box}

.lbl{font-size:13px;font-weight:700;line-height:1.15;text-align:center;padding:1px 4px;border-radius:2px}
</style>
